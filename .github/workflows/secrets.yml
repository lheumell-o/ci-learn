name: Secrets et variables

on:
  workflow_dispatch:            # lancement manuel : bouton « Run workflow »

permissions:
  contents: read                    # le droit minimal : lire le contenu

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      ENVIRONNEMENT: ${{ vars.ENVIRONNEMENT }}     # variable : le préfixe est « vars »

    steps:
      - name: Lire une variable
        run: | 
          echo "Environnement : $ENVIRONNEMENT"

      - name: Utiliser un secret
        env:
          MOT_SECRET: ${{ secrets.MOT_SECRET }}       # secret : quel préfixe ?
        run: |
          echo "Longueur : ${#MOT_SECRET}"
          echo "Valeur   : $MOT_SECRET"

      - name: Essayer de contourner le masquage
        env:
          MOT_SECRET: ${{ secrets.MOT_SECRET }}
        run: echo "$MOT_SECRET" | base64