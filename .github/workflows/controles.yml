name: Contrôles

on:
  push:                        # au push sur main
    branches: [main]
  # pull_request:                        # et à chaque pull request

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4             # récupérer le code : la ligne vue plus haut
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier la syntaxe
        run: npm run lint             # le script « lint » de package.json

  tests:
    runs-on: ubuntu-latest
    needs: lint                 # ne démarre qu'après « lint »
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lancer les tests
        run: npm run test              # le script « test »